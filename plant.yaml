# Plant model for the ClearTrend Flex demo — extracted from client screen
# captures (SSRS "Libre Yield and OEE Dashboard" + "Daily Libre Container OEE",
# 2026-08-06). Rebuilding this demo for another prospect = edit this file only.

epoch: "2026-07-20T00:00:00Z"   # simulator origin; backfill never reaches past this

production:
  start_hour: 6      # production day starts 06:00 plant-local
  end_hour: 22       # confirmed by Todd 2026-08-09
  timezone: "America/Chicago"
  days: [Mon, Tue, Wed, Thu, Fri, Sat]   # confirmed by Todd 2026-08-09

# Color legend from the captured "Daily" report
legend:
  yield_green: 95.0
  yield_yellow: 93.0
  pass_hr_green: 2100
  pass_hr_yellow: 1900

factories:
  SMT:
    display: "SMT Factory"
    yield_target: 99.0
    oee_target: 70
    lines:
      SMT01: {uph: 3400, perf_base: 0.88, yield_offset: -2.0}
      SMT02: {uph: 3000, perf_base: 0.78, yield_offset: -2.8}
      SMT05: {uph: 3200, perf_base: 0.82, yield_offset: -1.3}
  Puck:
    display: "Puck Factory"
    yield_target: 97.5
    oee_target: 65
    lines:
      ABW03: {uph: 2800, perf_base: 0.72, yield_offset: -0.1}
      ABW04: {uph: 3300, perf_base: 0.80, yield_offset: 1.2}
      ABW05: {uph: 2900, perf_base: 0.60, yield_offset: -2.9}
      ABW06: {uph: 2700, perf_base: 0.62, yield_offset: -2.2}
      ABW07: {uph: 2600, perf_base: 0.65, yield_offset: -1.0, long_down_prone: true}
  Applicator:
    display: "Applicator Factory"
    yield_target: 97.25
    oee_target: 55
