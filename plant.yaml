    display: "Container Factory"
    yield_target: 95.0
    oee_target: 67
    lines:
      AAL04: {uph: 3000, perf_base: 0.70, yield_offset: -0.4}
      AAL05: {uph: 2600, perf_base: 0.55, yield_offset: -8.0, changeover_heavy: true}
      AAL06: {uph: 3100, perf_base: 0.78, yield_offset: -2.9}
      AAL07: {uph: 2400, perf_base: 0.50, yield_offset: -4.4}
      AAL08: {uph: 3200, perf_base: 0.72, yield_offset: -5.0}
  KitPack:
    display: "KitPack Factory"
    yield_target: 97.5
    oee_target: 75
    lines:
      MSI03: {uph: 3000, perf_base: 0.80, yield_offset: 1.2}
      MSI04: {uph: 3300, perf_base: 0.85, yield_offset: 1.1}
      MSI05: {uph: 2900, perf_base: 0.68, yield_offset: 0.3}
      MSI07: {uph: 3000, perf_base: 0.82, yield_offset: 1.9}
      MSI08: {uph: 3100, perf_base: 0.70, yield_offset: 1.0}

