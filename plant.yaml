# Plant model for the ClearTrend Flex demo — extracted from client screen
# captures (SSRS "Plant Yield and OEE Dashboard" + "Daily Packaging OEE",
# 2026-08-06). Rebuilding this demo for another prospect = edit this file only.

epoch: "2026-07-20T00:00:00Z"   # simulator origin; backfill never reaches past this

production:
  start_hour: 6      # production day starts 06:00 plant-local
  end_hour: 22       # confirmed by Todd 2026-08-09
  timezone: "America/Chicago"
  days: [Mon, Tue, Wed, Thu, Fri, Sat]   # confirmed by Todd 2026-08-09

# Color legend from the captured "Daily" report
legend:
  yield_green: 95.0
  yield_yellow: 93.0
  pass_hr_green: 2100
  pass_hr_yellow: 1900

factories:
  Assembly:
    display: "Assembly Factory"
    yield_target: 99.0
    oee_target: 70
    lines:
      ASM01: {uph: 3400, perf_base: 0.88, yield_offset: -2.0}
      ASM02: {uph: 3000, perf_base: 0.78, yield_offset: -2.8}
      ASM05: {uph: 3200, perf_base: 0.82, yield_offset: -1.3}
  Molding:
    display: "Molding Factory"
    yield_target: 97.5
    oee_target: 65
    lines:
      MLD03: {uph: 2800, perf_base: 0.72, yield_offset: -0.1}
      MLD04: {uph: 3300, perf_base: 0.80, yield_offset: 1.2}
      MLD05: {uph: 2900, perf_base: 0.60, yield_offset: -2.9}
      MLD06: {uph: 2700, perf_base: 0.62, yield_offset: -2.2}
      MLD07: {uph: 2600, perf_base: 0.65, yield_offset: -1.0, long_down_prone: true}
  Coating:
    display: "Coating Factory"
    yield_target: 97.25
    oee_target: 55
    lines:
      COT01: {uph: 2400, perf_base: 0.65, yield_offset: -0.3}
      COT02: {uph: 3200, perf_base: 0.75, yield_offset: 0.0}
      COT03: {uph: 3000, perf_base: 0.70, yield_offset: 0.5}
  Packaging:                       # chronic laggard per captures (~90% yield)
    display: "Packaging Factory"
    yield_target: 95.0
    oee_target: 67
    lines:
      PKG04: {uph: 3000, perf_base: 0.70, yield_offset: -0.4}
      PKG05: {uph: 2600, perf_base: 0.55, yield_offset: -8.0, changeover_heavy: true}
      PKG06: {uph: 3100, perf_base: 0.78, yield_offset: -2.9}
      PKG07: {uph: 2400, perf_base: 0.50, yield_offset: -4.4}
      PKG08: {uph: 3200, perf_base: 0.72, yield_offset: -5.0}
  Kitting:
    display: "Kitting Factory"
    yield_target: 97.5
    oee_target: 75
    lines:
      KIT03: {uph: 3000, perf_base: 0.80, yield_offset: 1.2}
      KIT04: {uph: 3300, perf_base: 0.85, yield_offset: 1.1}
      KIT05: {uph: 2900, perf_base: 0.68, yield_offset: 0.3}
      KIT07: {uph: 3000, perf_base: 0.82, yield_offset: 1.9}
      KIT08: {uph: 3100, perf_base: 0.70, yield_offset: 1.0}

skus: [SKU-1042, SKU-1179, SKU-2044, SKU-2311, SKU-3007]
operators: [J.Alvarez, M.Chen, D.Okafor, R.Patel, K.Simmons, T.Nguyen]
