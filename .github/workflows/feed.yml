# Regenerates the CSVs the dashboards read. There is no metrics ingestion here:
# this stack rejects samples older than ~1 h (measured), so the 14-day history
# is served as files from the repo instead. See README.
name: feed
on:
  schedule:
    - cron: "*/10 * * * *"    # live files: today / events / status / rollups
    - cron: "20 5 * * *"      # full window: hourly + state, slides the 21-day window
  workflow_dispatch:
    inputs:
      full:
        description: "Regenerate the whole 21-day window, not just the live files"
        type: boolean
        default: false
      push_dashboards:
        description: "Also build and push the dashboards to Grafana"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Install deps
        run: pip install pyyaml

      - name: Regenerate dataset
        run: |
          if [ "${{ inputs.full }}" = "true" ] || [ "${{ github.event.schedule }}" = "20 5 * * *" ]; then
            python feeder/build_dataset.py
          else
            python feeder/build_dataset.py --live
          fi

      - name: Commit if changed
        run: |
          git config user.name feeder-bot
          git config user.email bot@cpme-usa.com
          git add data
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "data: refresh $(date -u +%FT%TZ)"
            git pull --rebase --autostash origin main || true
            git push
          fi

      # Dashboards are pushed from the runner so the large JSON never needs to
      # leave the repo. Requires GRAFANA_URL, GRAFANA_SA_TOKEN, INFINITY_UID.
      - name: Push dashboards to Grafana
        if: inputs.push_dashboards == true
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_SA_TOKEN: ${{ secrets.GRAFANA_SA_TOKEN }}
          INFINITY_UID: ${{ secrets.INFINITY_UID }}
          DATA_BASE: ${{ vars.DATA_BASE || format('https://raw.githubusercontent.com/{0}/main/data', github.repository) }}
        run: |
          pip install requests
          python dashboards/build_dashboards.py --push
